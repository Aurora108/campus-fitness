<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b36"><title>我的校园运动打卡</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#19342f;background:#f5f8f6}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:22px 16px 80px}header{background:#173b36;color:white;padding:25px 20px;border-radius:22px}h1{margin:4px 0 8px;font-size:26px}h2{font-size:19px;margin:22px 0 12px}p{line-height:1.6}small,.muted{color:#667b74}.white{color:#d5e6df}.card{background:white;border:1px solid #e0e9e3;border-radius:17px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #173b3608}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{background:#e3f3e9;border-radius:30px;padding:6px 10px;font-size:12px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}button{border:0;border-radius:12px;padding:12px 14px;background:#216e5a;color:white;font-weight:600;font-size:15px;cursor:pointer}button.secondary{background:#e8f1ec;color:#245c4d}button.active{background:#173b36}button:disabled{opacity:.45}button.full{width:100%}.tabs button{font-size:13px}input{padding:11px;border:1px solid #c9d9cf;border-radius:10px;width:100%;font-size:16px}label{display:block;margin:8px 0;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.progress{height:9px;background:#e5eee8;border-radius:10px;overflow:hidden}.bar{height:100%;background:#3b9877;transition:width .2s}.exercise{display:flex;gap:12px;align-items:center}.circle{width:46px;height:46px;border-radius:14px;background:#e8f4ed;display:grid;place-items:center;font-size:23px;flex-shrink:0}.exercise button{min-width:68px}.details{border-top:1px solid #e7ede9;margin-top:12px;padding-top:10px}.details p{margin:7px 0;font-size:14px}details summary{cursor:pointer;color:#236c59;font-weight:600}.done{background:#d7eee0!important;color:#1b634d!important}.hint{background:#fff6df;border-radius:12px;padding:12px;font-size:13px;line-height:1.6}#timer{font-size:44px;font-weight:700;text-align:center;padding:16px}.stat{font-size:23px;font-weight:700}footer{font-size:12px;color:#73877f;margin-top:30px;line-height:1.7}</style></head><body><main><header><div class="white" id="date"></div><h1>校园运动打卡</h1><div class="white">游泳 · 宿舍力量 · 轻柔呼吸 · 饭后散步</div><p style="margin-bottom:0">114斤 → 100斤 · 稳步进行，不追求快速减重</p></header><div class="tabs"><button onclick="tab('today')" id="btoday">今日任务</button><button onclick="tab('records')" id="brecords" class="secondary">记录趋势</button><button onclick="tab('guide')" id="bguide" class="secondary">动作手册</button></div><section id="today"></section><section id="records" hidden></section><section id="guide" hidden></section><footer>数据仅保存在当前浏览器设备的本地存储中；清除浏览器数据、使用无痕模式或更换设备可能丢失记录。此工具不提供医疗诊断。出现疼痛、头晕、胸闷或呼吸不适时停止训练。</footer></main><script>
const names=['周日','周一','周二','周三','周四','周五','周六'];const today=new Date(),key=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');document.getElementById('date').textContent=key+' · '+names[today.getDay()];const storeKey='campus-fit-v1';let db;try{db=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){db={}}db.days??={};db.measurements??=[];db.days[key]??={};function save(){localStorage.setItem(storeKey,JSON.stringify(db))}function done(id){db.days[key][id]=!db.days[key][id];save();render()}function check(id){return !!db.days[key][id]}
const exercises=[{id:'squat',name:'徒手深蹲',icon:'◉',dose:'10～12次 × 2组',steps:'双脚约与肩同宽，脚掌踩稳；臀部向后向下坐，膝盖顺着脚尖方向弯曲；保持呼吸自然，站起时收紧臀腿。',errors:'避免脚跟离地、膝盖内扣、憋气；不必强求蹲很深。',easy:'先做椅子坐站，8次 × 1组。'},{id:'bridge',name:'臀桥',icon:'⌒',dose:'12次 × 2组',steps:'仰卧屈膝、双脚踩地；呼气时用臀部发力抬髋，身体从肩到膝大致成直线；缓慢放下。',errors:'不要过度拱腰、屏气或用脖子顶地。',easy:'8次 × 1组，抬到舒适高度即可。'},{id:'push',name:'靠墙俯卧撑',icon:'▤',dose:'8～12次 × 2组',steps:'面对墙站立，双手略宽于肩撑墙；身体保持一条直线，弯肘让胸部靠近墙，再推回。',errors:'避免塌腰、耸肩、突然弹回。',easy:'站近墙面，8次 × 1组。'},{id:'bird',name:'鸟狗式',icon:'✣',dose:'每侧6～8次 × 2组',steps:'四点跪姿，手在肩下、膝在髋下；慢慢伸展对侧手和腿，保持骨盆稳定；回到起点换侧。',errors:'避免扭转骨盆、抬腿过高、塌腰和憋气。',easy:'先只伸手或只伸腿。'},{id:'dead',name:'死虫式',icon:'✳',dose:'每侧6次 × 2组',steps:'仰卧，双手朝上、髋膝屈曲；慢慢向远处移动对侧手和腿，再返回；始终保持腰部舒适稳定。',errors:'腰痛或腰部明显拱起时缩小动作幅度，不要憋气。',easy:'双脚保持着地，交替抬一只脚。'},{id:'breath',name:'轻柔呼吸练习',icon:'≈',dose:'3～5分钟',steps:'舒适仰卧或坐姿，肩颈放松；鼻子轻轻吸气，感受下肋骨自然活动，再舒适地慢慢呼气；按照自然节奏持续3～5分钟。',errors:'不要强迫深吸、屏气或追求固定秒数；头晕、胸闷、气短时停止。',easy:'只做1分钟自然呼吸觉察也可以。'},{id:'swim',name:'游泳',icon:'≋',dose:'30～45分钟（逐步增加）',steps:'下水前热身；以能够控制呼吸的舒适速度游泳，疲劳时在池边休息；结束后补水。',errors:'不要独自冒险游泳、不要憋气比拼；饭后根据饱腹感安排间隔。',easy:'先游20～30分钟，分段休息。'},{id:'walkl',name:'午饭后散步',icon:'↗',dose:'10～15分钟',steps:'饭后按舒适程度轻松走动，保持能正常说话的速度。',errors:'不需要快走、跑步；不舒服时休息。',easy:'5分钟也可以。'},{id:'walkd',name:'晚饭后散步',icon:'↗',dose:'15～20分钟',steps:'在校园轻松散步，速度以舒适为准。',errors:'不需要通过散步抵消吃下去的食物。',easy:'先走10分钟。'}];let day=today.getDay();let ids=day===0?['walkl','walkd','breath']:day===1||day===3||day===5?['swim','walkl','walkd','breath']:day===6?['squat','bridge','bird','walkl','walkd','breath']:['squat','bridge','push','bird','dead','walkl','walkd','breath'];function exCard(e){return `<article class="card"><div class="exercise"><div class="circle">${e.icon}</div><div style="flex:1"><b>${e.name}</b><div class="muted" style="font-size:13px;margin-top:3px">${e.dose}</div></div><button class="${check(e.id)?'done':'secondary'}" onclick="done('${e.id}')">${check(e.id)?'已完成 ✓':'打卡'}</button></div><details class="details"><summary>查看标准动作与注意事项</summary><p><b>动作标准：</b>${e.steps}</p><p><b>注意事项：</b>${e.errors}</p><p><b>简化版：</b>${e.easy}</p></details></article>`}
function render(){let complete=ids.filter(check).length;document.getElementById('today').innerHTML=`<h2>今日安排 · ${day===0?'休息恢复':day===1||day===3||day===5?'游泳日':day===6?'轻量力量日':'宿舍力量日'}</h2><div class="card"><div class="row"><b>完成进度</b><span>${complete}/${ids.length}</span></div><div class="progress" style="margin-top:12px"><div class="bar" style="width:${100*complete/ids.length}%"></div></div></div><div class="hint">力量训练前先活动3分钟，组间休息30～60秒。初学者前两周每个动作先做1组；游泳日不必额外做力量训练。周六疲劳可休息。</div>${ids.map(id=>exCard(exercises.find(e=>e.id===id))).join('')}<h2>组间休息计时器</h2><div class="card"><div id="timer">00:45</div><div class="grid"><button onclick="startTimer()">开始45秒</button><button class="secondary" onclick="resetTimer()">重置</button></div></div>`;renderRecords();renderGuide()}
let timerInterval=null,seconds=45;function paintTimer(){let el=document.getElementById('timer');if(el)el.textContent='00:'+String(seconds).padStart(2,'0')}function resetTimer(){clearInterval(timerInterval);timerInterval=null;seconds=45;paintTimer()}function startTimer(){clearInterval(timerInterval);seconds=45;paintTimer();timerInterval=setInterval(()=>{seconds--;paintTimer();if(seconds<=0){clearInterval(timerInterval);timerInterval=null;try{navigator.vibrate?.(200)}catch(e){} }},1000)}function tab(which){for(let x of ['today','records','guide']){document.getElementById(x).hidden=x!==which;document.getElementById('b'+x).className=x===which?'active':'secondary'}}function addMeasurement(){let w=Number(document.getElementById('weight').value),wa=document.getElementById('waist').value;if(!(w>=35&&w<=200)){alert('请输入合理的体重（kg）');return}if(wa&&!(Number(wa)>=40&&Number(wa)<=160)){alert('请检查腰围（cm）');return}db.measurements.push({date:key,weight:w,waist:wa?Number(wa):null});save();renderRecords()}function renderRecords(){let d=Object.entries(db.days).sort((a,b)=>b[0].localeCompare(a[0]));let m=[...db.measurements].reverse();document.getElementById('records').innerHTML=`<h2>体重与腰围</h2><div class="card"><p class="muted">建议每周记录体重平均值及腰围，不必每天称重。</p><div class="grid"><label>体重（kg）<input id="weight" type="number" step="0.1" placeholder="例如 57.0"></label><label>腰围（cm，可选）<input id="waist" type="number" step="0.1" placeholder="例如 75"></label></div><button class="full" onclick="addMeasurement()">保存本次记录</button></div><h2>最近记录</h2>${m.length?m.slice(0,15).map(x=>`<div class="card row"><span>${x.date}</span><b>${x.weight} kg${x.waist?' · 腰围 '+x.waist+' cm':''}</b></div>`).join(''):'<div class="card muted">尚无体重记录</div>'}<h2>最近打卡</h2>${d.slice(0,14).map(([date,rec])=>`<div class="card row"><span>${date}</span><b>${Object.values(rec).filter(Boolean).length} 项完成</b></div>`).join('')}<button class="secondary full" onclick="exportData()">导出记录备份（JSON）</button>`}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='运动打卡备份-'+key+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function renderGuide(){document.getElementById('guide').innerHTML='<h2>动作标准手册</h2><p class="muted">可随时打开查看动作标准、常见错误和简化版本。</p>'+exercises.map(e=>`<div class="card"><b>${e.name}</b><p class="muted">${e.dose}</p><p><b>标准：</b>${e.steps}</p><p><b>注意：</b>${e.errors}</p><p><b>简化：</b>${e.easy}</p></div>`).join('')}render();tab('today');</script></body></html>
